[package]
name = "github-auth"
version = "0.0.0"
description = "Local encrypted GitHub account vault"
authors = ["Github Auth"]
edition = "2021"

[lib]
name = "github_auth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
constant_time_eq = "0.3"
data-encoding = "2"
hkdf = "0.12"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "service", "tokio"] }
pbkdf2 = "0.12"
rand = "0.8"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rfd = "0.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
time = "0.3"
totp-rs = { version = "5", features = ["otpauth", "qr", "zeroize"] }
uuid = { version = "1", features = ["serde", "v4"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
  "Foundation",
  "Security_Credentials_UI",
] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
